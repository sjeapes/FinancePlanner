# ============================================================
# LifeLedger — Base Scenario
# Scenario: "Current Plan"
# All amounts in GBP unless currency specified.
# ============================================================

scenario:
  id: "base"
  name: "Current Plan"
  description: "Baseline projection — retire at 60, current savings rates"
  is_base: true
  created_at: "2025-03-08"
  modified_at: "2025-03-08"
  colour: "#0e9aad"           # used in UI graph overlays

# ── People ───────────────────────────────────────────────────
people:
  - id: "james"
    name: "James"
    date_of_birth: "1987-06-15"
    retirement_age: 60
    life_expectancy: 90
    tax_profile_id: "uk_standard"
    state_pension:
      eligible: true
      qualifying_years: 22
      full_qualifying_years: 35
      expected_start_age: 67
      weekly_amount: 221.20   # current full new state pension (2024/25)
      deferral_years: 0

  - id: "sarah"
    name: "Sarah"
    date_of_birth: "1989-09-22"
    retirement_age: 60
    life_expectancy: 92
    tax_profile_id: "uk_standard"
    state_pension:
      eligible: true
      qualifying_years: 18
      full_qualifying_years: 35
      expected_start_age: 67
      weekly_amount: 221.20
      deferral_years: 0

# ── Income Sources ───────────────────────────────────────────
income_sources:
  - id: "james_salary"
    name: "Software Engineering Salary"
    person_id: "james"
    gross_annual: 95000
    currency: "GBP"
    tax_treatment: "PAYE"
    start_date: "2018-03-01"
    end_date: "2047-06-30"     # retirement date
    annual_growth_rate: 0.03   # 3% pay rises
    # Routing: where does the net income go?
    # Income is NOT auto-added to net worth — only explicit contributions count
    contributions:
      - destination_account_id: "vanguard_isa"
        rate: 0.10             # 10% of gross → ISA
        cap_annual: 20000
      - destination_account_id: "vanguard_sipp"
        rate: 0.05             # 5% employee contribution
        employer_top_up: 0.05  # 5% employer match
        cap_annual: 60000

  - id: "sarah_salary"
    name: "Sarah — Marketing Manager"
    person_id: "sarah"
    gross_annual: 62000
    currency: "GBP"
    tax_treatment: "PAYE"
    start_date: "2016-09-01"
    end_date: "2049-09-22"
    annual_growth_rate: 0.025
    contributions:
      - destination_account_id: "sarah_sipp"
        rate: 0.05
        employer_top_up: 0.04

  - id: "james_consulting"
    name: "Freelance Consulting"
    person_id: "james"
    gross_annual: 15000
    currency: "GBP"
    tax_treatment: "self_employed"
    start_date: "2024-01-01"
    end_date: "2028-12-31"
    annual_growth_rate: 0.0
    contributions: []

