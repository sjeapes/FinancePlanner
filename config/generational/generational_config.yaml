# =============================================================================
# LifeLedger — Generational & Cross-Jurisdiction Configuration (Phase 7)
# =============================================================================
# Covers all assumptions for multi-generation and UK vs US comparison modelling.
# All monetary values in the native currency of the path (GBP for UK, USD for US).
# Rates as decimals. Ages in years.
# =============================================================================

generational:

  # ---------------------------------------------------------------------------
  # Parents
  # ---------------------------------------------------------------------------
  parents:
    person1:
      id: person1
      birth_year: 1980              # ← replace with your birth year
      life_expectancy: 87
      retire_year: 2045

    person2:
      id: person2
      birth_year: 1982              # ← replace with partner's birth year
      life_expectancy: 90
      retire_year: 2046

    # Starting assets (2026 baseline, in each currency as held)
    starting_assets:
      uk_sipp_gbp: 150000           # ← replace with your pension value
      uk_isa_gbp: 120000            # ← replace with your ISA value
      us_equities_usd: 0            # ← replace if holding US assets

    # ── US working phase (if applicable) ──────────────────────────────────────
    us_phase:
      enabled: false                # set true if you have a US working phase
      start_year: 2026
      end_year: 2028
      gross_salary_usd: 600000      # combined household gross
      state: WA                     # WA = 0% state income tax
      k401_employee: 23500          # 2024 IRS limit
      k401_employer_match: 10000
      annual_living_cost_usd: 150000
      extra_savings_target_usd: 100000

    # ── UK working phase ───────────────────────────────────────────────────────
    uk_phase:
      start_year: 2026              # adjust if US phase runs first
      primary_gross_gbp: 80000      # ← replace
      spouse_gross_gbp: 55000       # ← replace
      primary_pension_rate: 0.05    # employee contribution rate
      employer_pension_rate: 0.05
      isa_annual_contribution: 20000
      annual_living_cost_gbp: 36000

    # Social Security / State Pension
    social_security:
      us_monthly_benefit_usd: 2300  # estimated monthly at age 67
      us_claim_age: 67
      uk_state_pension_weekly_gbp: 221.20
      uk_state_pension_age: 67


  # ---------------------------------------------------------------------------
  # Offspring
  # ---------------------------------------------------------------------------
  offspring:

    - id: offspring1
      name: "Child"                 # ← replace with actual name
      birth_year: 2017              # ← replace
      life_expectancy: 92
      projection_end_year: 2109
      default_career_path: software_engineer
      default_country: uk

      university:
        uk_start_year: 2035
        uk_duration_years: 3
        us_start_year: 2035
        us_duration_years: 4

      # LISA for UK first home deposit assistance
      lisa:
        enabled: true
        annual_contribution: 4000   # max
        government_bonus_pct: 0.25  # 25% of contributions = £1,000/yr bonus
        start_year: 2035            # eligible from 18th birthday
        projected_balance_at_first_home: 22000


  # ---------------------------------------------------------------------------
