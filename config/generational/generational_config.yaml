  # ---------------------------------------------------------------------------
  # University Costs
  # ---------------------------------------------------------------------------
  university:

    uk:
      tuition_per_year: 9250        # Plan 5 annual tuition cap
      living_costs_per_year: 12000  # moderate estimate
      parent_contribution_total: 20000
      student_loan_plan: 5
      loan_repayment_threshold: 25000
      loan_repayment_rate: 0.09     # 9% of income above threshold
      loan_write_off_years: 40
      loan_interest_rate: 0.045     # RPI + 1.5% approx

    us:
      low:                          # in-state public
        type: in_state_public
        tuition_per_year: 14000
        living_per_year: 18000
        funding: 529_plan
      mid:                          # out-of-state public / mid private
        type: out_of_state_public
        tuition_per_year: 28000
        living_per_year: 20000
        funding: 529_plan
      high:                         # elite private
        type: elite_private
        tuition_per_year: 62000
        living_per_year: 25000
        funding: scholarships_and_loans

    # 529 plan assumptions (if used)
    plan_529:
      current_balance: 136000       # USD at offspring university start
      annual_contribution_before_start: 0
      growth_rate: 0.07
      state_tax_deduction_rate: 0.0  # varies; 0 for WA


  # ---------------------------------------------------------------------------
  # FX Rate Scenarios (GBP / USD)
  # ---------------------------------------------------------------------------
  fx:
    scenarios:
      low:  1.18    # weak GBP (unfavourable for UK path in USD terms)
      mid:  1.27    # current mid-market
      high: 1.38    # strong GBP (favourable for UK path)
    annual_drift: 0.0     # mean-reversion assumption: 0 = flat


  # ---------------------------------------------------------------------------
  # Estate / Tax Handoff
  # ---------------------------------------------------------------------------
  estate:
    uk:
      nil_rate_band: 325000
      residence_nil_rate_band: 175000
      iht_rate: 0.40
      pension_outside_estate: true  # pre-April 2027 rules default; set false for post-2027
    us:
      federal_exemption: 14000000   # per person (2026 OBBBA levels)
      estate_tax_rate: 0.40
      stepped_up_basis: true        # inherited assets get cost-basis step-up to FMV at death


  # ---------------------------------------------------------------------------
  # Offspring account growth assumptions
  # ---------------------------------------------------------------------------
  offspring_accounts:
    uk:
      isa_growth_rate: 0.07
      sipp_growth_rate: 0.07
      gia_growth_rate: 0.062
      savings_interest_rate: 0.035
      isa_annual_limit: 20000
      sipp_annual_limit: 60000
      savings_rate_of_income: 0.20    # fraction of net income routed to savings
    us:
      k401_growth_rate: 0.075
      roth_growth_rate: 0.075
      taxable_growth_rate: 0.065
      k401_employee_limit: 23500      # 2024 IRS limit
      roth_ira_limit: 7000
      savings_rate_of_income: 0.20
